services:
  namenode:
    volumes:
      - /mnt/module4-storage-20261009/namenode:/hadoop/dfs/name
  datanode:
    volumes:
      - /mnt/module4-storage-20261009/datanode:/hadoop/dfs/data
  spark-worker:
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--cores", "4", "--memory", "2g", "spark://spark-master:7077"]
    environment:
      SPARK_LOCAL_DIRS: /module4-local/worker
      SPARK_WORKER_DIR: /module4-local/work
    volumes:
      - /var/lib/module4-local-20261010:/module4-local
  module4:
    environment:
      SPARK_LOCAL_DIRS: /module4-local/driver
      PYSPARK_SUBMIT_ARGS: --driver-memory 1g --conf spark.ui.showConsoleProgress=false --conf spark.driver.host=module4 --conf spark.driver.bindAddress=0.0.0.0 pyspark-shell
    volumes:
      - /var/lib/module4-local-20261010:/module4-local
  mongodb:
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - /mnt/module4-storage-20261009/mongodb:/data/db
