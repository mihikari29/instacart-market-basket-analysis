services:
  namenode:
    volumes:
      - /mnt/module4-storage-20261009/namenode:/hadoop/dfs/name
  datanode:
    volumes:
      - /mnt/module4-storage-20261009/datanode:/hadoop/dfs/data
  spark-worker:
    environment:
      SPARK_LOCAL_DIRS: /workspace/results/spark-local/worker
      SPARK_WORKER_DIR: /workspace/results/spark-local/work
  module4:
    environment:
      SPARK_LOCAL_DIRS: /workspace/results/spark-local/module4
  mongodb:
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - /mnt/module4-storage-20261009/mongodb:/data/db
