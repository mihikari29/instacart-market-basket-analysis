services:
  module4d-mongo:
    image: mongo:7.0.16@sha256:c630c59342c1493d50345136df2af14a76b9e827dd5316bfabee07a0880a5f3a
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MODULE4D_DEMO_ROOT_PASSWORD:?generate a private demo env file first}
    tmpfs:
      - /data/db:rw,noexec,nosuid,size=768m
      - /data/configdb:rw,noexec,nosuid,size=64m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin --eval "db.adminCommand('ping').ok" | grep -q 1
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks: [module4d-database]
    labels:
      com.codex.task: module4d-d3-release
      com.codex.resource: mongodb-fixture

  fixture:
    image: instacart-module4d-demo-api:${MODULE4D_DEMO_TAG:?generate a private demo env file first}
    profiles: [fixture]
    entrypoint: [python3, scripts/module4d_demo_fixture.py]
    environment:
      MODULE4D_DEMO_DATABASE: ${MODULE4D_DEMO_DATABASE:?}
      MODULE4D_DEMO_ROOT_URI: mongodb://root:${MODULE4D_DEMO_ROOT_PASSWORD}@module4d-mongo:27017/${MODULE4D_DEMO_DATABASE}?authSource=admin
      MODULE4D_DEMO_READONLY_USERNAME: ${MODULE4D_DEMO_READONLY_USERNAME:?}
      MODULE4D_DEMO_READONLY_PASSWORD: ${MODULE4D_DEMO_READONLY_PASSWORD:?}
      MODULE4D_DEMO_TREND_NAMESPACE: ${MODULE4D_DEMO_TREND_NAMESPACE:?}
      SPARK_LOCAL_IP: 127.0.0.1
    depends_on:
      module4d-mongo:
        condition: service_healthy
    networks: [module4d-database]
    labels:
      com.codex.task: module4d-d3-release
      com.codex.resource: synthetic-fixture-publisher

  validator:
    image: instacart-module4d-demo-api:${MODULE4D_DEMO_TAG:?generate a private demo env file first}
    profiles: [fixture]
    entrypoint: [python3, scripts/module4d_demo_validate.py]
    environment:
      MODULE4D_DEMO_DATABASE: ${MODULE4D_DEMO_DATABASE:?}
      MODULE4D_DEMO_READONLY_USERNAME: ${MODULE4D_DEMO_READONLY_USERNAME:?}
      MODULE4D_DEMO_READONLY_PASSWORD: ${MODULE4D_DEMO_READONLY_PASSWORD:?}
      MODULE4D_DEMO_TREND_NAMESPACE: ${MODULE4D_DEMO_TREND_NAMESPACE:?}
      MODULE4D_DEMO_API_BASE_URL: http://module4d-api:8000
    depends_on:
      module4d-mongo:
        condition: service_healthy
      module4d-api:
        condition: service_healthy
    networks: [module4d-database, module4d-frontend]
    labels:
      com.codex.task: module4d-d3-release
      com.codex.resource: live-api-validator

  module4d-api:
    image: instacart-module4d-demo-api:${MODULE4D_DEMO_TAG:?generate a private demo env file first}
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      labels:
        com.codex.task: module4d-d3-release
    entrypoint:
      - python3
      - -m
      - uvicorn
      - src.module4.dashboard.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      MODULE4D_MONGODB_URI: mongodb://${MODULE4D_DEMO_READONLY_USERNAME}:${MODULE4D_DEMO_READONLY_PASSWORD}@module4d-mongo:27017/${MODULE4D_DEMO_DATABASE}?authSource=${MODULE4D_DEMO_DATABASE}
      MODULE4D_MONGO_DATABASE: ${MODULE4D_DEMO_DATABASE:?}
      MODULE4D_TREND_SOURCE_NAMESPACES: ${MODULE4D_DEMO_TREND_NAMESPACE:?}
      MODULE4D_APP_ROOT: /workspace
    ports:
      - 127.0.0.1:${MODULE4D_DEMO_API_HOST_PORT:-18000}:8000
    depends_on:
      module4d-mongo:
        condition: service_healthy
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks: [module4d-database, module4d-frontend]
    labels:
      com.codex.task: module4d-d3-release
      com.codex.resource: fastapi-readonly-api

  module4d-ui:
    image: instacart-module4d-demo-ui:${MODULE4D_DEMO_TAG:?generate a private demo env file first}
    build:
      context: .
      dockerfile: Dockerfile
      target: ui
      labels:
        com.codex.task: module4d-d3-release
    environment:
      MODULE4D_API_BASE_URL: http://module4d-api:8000
      MODULE4D_TREND_SOURCE_NAMESPACES: ${MODULE4D_DEMO_TREND_NAMESPACE:?}
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_HEADLESS: "true"
    ports:
      - 127.0.0.1:${MODULE4D_DEMO_UI_HOST_PORT:-18501}:8501
    depends_on:
      module4d-api:
        condition: service_healthy
    networks: [module4d-frontend]
    labels:
      com.codex.task: module4d-d3-release
      com.codex.resource: streamlit-dashboard

networks:
  module4d-database:
    labels:
      com.codex.task: module4d-d3-release
      com.codex.resource: isolated-database-network
  module4d-frontend:
    labels:
      com.codex.task: module4d-d3-release
      com.codex.resource: isolated-api-ui-network
