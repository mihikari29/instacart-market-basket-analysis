# Module 1 transport layer (local dev)
#   Kafka   : single-node KRaft broker -> topic instacart-purchase-events
#   HDFS    : single-node (NameNode + DataNode) -> /instacart layout
services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: instacart-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: instacart-namenode
    hostname: namenode
    ports:
      - "9870:9870"
      - "8020:8020"
    environment:
      CLUSTER_NAME: instacart
      CORE_CONF_fs_defaultFS: "hdfs://namenode:8020"
      HDFS_CONF_dfs_replication: "1"
      HDFS_CONF_dfs_webhdfs_enabled: "true"
      HDFS_CONF_dfs_namenode_webhdfs_allowed_hosts: "*"
      HADOOP_OPTIONAL_TOOLS: hadoop-azure
    volumes:
      - namenode_data:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: instacart-datanode
    hostname: datanode
    ports:
      - "9864:9864"
    environment:
      CORE_CONF_fs_defaultFS: "hdfs://namenode:8020"
      HDFS_CONF_dfs_replication: "1"
      HDFS_CONF_dfs_datanode_webhdfs_enabled: "true"
      SERVICE_PRECONDITION: "namenode:9870"
    volumes:
      - datanode_data:/hadoop/dfs/data

volumes:
  namenode_data:
  datanode_data: