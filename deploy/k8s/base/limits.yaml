apiVersion: v1
kind: ResourceQuota
metadata:
  namespace: __K8S_RENDER_REQUIRED__
  name: it4931-quota
  labels:
    app.kubernetes.io/part-of: instacart-k8s-demo
spec:
  hard:
    pods: "32"
    persistentvolumeclaims: "6"
    requests.cpu: "6"
    requests.memory: 12Gi
    requests.storage: 40Gi
    limits.cpu: "10"
    limits.memory: 16Gi
    requests.ephemeral-storage: 8Gi
    limits.ephemeral-storage: 12Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  namespace: __K8S_RENDER_REQUIRED__
  name: it4931-limits
  labels:
    app.kubernetes.io/part-of: instacart-k8s-demo
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 64Mi
      default:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 256Mi
      min:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "2"
        memory: 6Gi
        ephemeral-storage: 2Gi
