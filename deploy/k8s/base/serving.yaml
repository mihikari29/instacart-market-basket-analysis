apiVersion: v1
kind: Service
metadata:
  namespace: __K8S_RENDER_REQUIRED__
  name: module4d-api
  labels:
    app.kubernetes.io/name: module4d-api
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: module4d-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: __K8S_RENDER_REQUIRED__
  name: module4d-api
  labels:
    app.kubernetes.io/name: module4d-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: instacart-k8s-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: module4d-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: module4d-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: instacart-k8s-demo
    spec:
      serviceAccountName: module4d-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: instacart-module4d-k8s-api:b1
          imagePullPolicy: IfNotPresent
          command: [python3, -m, uvicorn]
          args:
            - src.module4.dashboard.api:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --workers
            - "1"
          env:
            - name: MODULE4D_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: module4d-api-readonly
                  key: mongodb-uri
            - name: MODULE4D_MONGO_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: module4d-api-config
                  key: MODULE4D_MONGO_DATABASE
            - name: MODULE4D_TREND_SOURCE_NAMESPACES
              valueFrom:
                configMapKeyRef:
                  name: module4d-api-config
                  key: MODULE4D_TREND_SOURCE_NAMESPACES
            - name: MODULE4D_APP_ROOT
              valueFrom:
                configMapKeyRef:
                  name: module4d-api-config
                  key: MODULE4D_APP_ROOT
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            exec:
              command: [python3, /workspace/scripts/k8s/api_readiness.py]
            periodSeconds: 10
            timeoutSeconds: 7
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
              readOnly: false
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  namespace: __K8S_RENDER_REQUIRED__
  name: module4d-ui
  labels:
    app.kubernetes.io/name: module4d-ui
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: module4d-ui
  ports:
    - name: http
      port: 8501
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: __K8S_RENDER_REQUIRED__
  name: module4d-ui
  labels:
    app.kubernetes.io/name: module4d-ui
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: instacart-k8s-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: module4d-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: module4d-ui
        app.kubernetes.io/component: dashboard
        app.kubernetes.io/part-of: instacart-k8s-demo
    spec:
      serviceAccountName: module4d-ui
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: instacart-module4d-k8s-ui:b1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: module4d-ui-config
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 256Mi
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import os, urllib.request;
                  urllib.request.urlopen(os.environ['MODULE4D_API_BASE_URL'] + '/health', timeout=3).read()
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
