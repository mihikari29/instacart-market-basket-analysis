apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pipeline-egress
  namespace: __K8S_RENDER_REQUIRED__
  labels:
    app.kubernetes.io/part-of: instacart-k8s-demo
    it4931.instacart.edu/component: pipeline
    it4931.instacart.edu/run-id: __RUN_ID__
spec:
  podSelector:
    matchLabels: {it4931.instacart.edu/role: pipeline}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: hdfs-namenode}}
      ports:
        - {protocol: TCP, port: 8020}
        - {protocol: TCP, port: 9870}
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: hdfs-datanode}}
      ports:
        - {protocol: TCP, port: 9864}
        - {protocol: TCP, port: 9866}
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: kafka}}
      ports:
        - {protocol: TCP, port: 29092}
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: module4d-mongo}}
      ports:
        - {protocol: TCP, port: 27017}
---
