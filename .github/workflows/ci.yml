name: Fast validation
# Runs on every push and every pull request. It owns the offline lint,
# repository test, API harness, UI and browser selections, so the
# service-backed workflow does not repeat them.
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build pinned Spark test runtime
        run: docker compose build spark-master
      - name: Lint
        run: >-
          docker run --rm -v "$PWD:/workspace" -w /workspace
          instacart-spark:3.5.5 ruff check .
      - name: Unit and fixture Spark tests
        run: >-
          docker run --rm -v "$PWD:/workspace" -w /workspace
          instacart-spark:3.5.5 python3 -m pytest -q
          --ignore=tests/test_dashboard_api_mongo.py
          --ignore=tests/test_dashboard_batch_api_mongo.py
          --ignore=tests/test_dashboard_ui_app.py
          --ignore=tests/test_dashboard_ui_client.py
          --ignore=tests/test_dashboard_ui_evaluation.py
      - name: Run D1A/D1B API and isolated MongoDB tests
        run: python3 scripts/dashboard/api_validation.py --mode all

  module4d-demo-browser:
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UI_TEST_IMAGE: instacart-module4d-ui-dev:ci-${{ github.run_id }}-${{ github.run_attempt }}
      BROWSER_IMAGE: instacart-module4d-demo-browser:ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated demo identity
        id: demo
        shell: bash
        run: |
          run_id="$(python3 -c 'import uuid; print(uuid.uuid4().hex[:12])')"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "env_file=$RUNNER_TEMP/module4d-demo-${run_id}.env" >> "$GITHUB_OUTPUT"
      - name: Run dashboard UI regression tests
        run: |
          docker build --label com.codex.task=module4d-d3-release \
            --build-arg MODULE4D_UI_DEV=1 \
            -f Dockerfile --target ui \
            -t "$UI_TEST_IMAGE" .
          docker run --rm \
            --label com.codex.task=module4d-d3-release \
            --label com.codex.resource=ui-regression-tests \
            -v "$PWD:/workspace:ro" -w /workspace \
            -e PYTHONPATH=/workspace \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTEST_ADDOPTS="-p no:cacheprovider" \
            "$UI_TEST_IMAGE" \
            python -m pytest -q \
            tests/test_dashboard_ui_app.py \
            tests/test_dashboard_ui_client.py \
            tests/test_dashboard_ui_evaluation.py
      - name: Run isolated MongoDB publisher, API, and Chromium release checks
        env:
          DEMO_RUN_ID: ${{ steps.demo.outputs.run_id }}
          DEMO_ENV_FILE: ${{ steps.demo.outputs.env_file }}
        shell: bash
        run: |
          set -euo pipefail
          # The demo helper owns the Compose project and image identities.
          python3 scripts/dashboard/demo.py up --run-id "$DEMO_RUN_ID" --env-file "$DEMO_ENV_FILE"

          docker build --label com.codex.task=module4d-d3-release \
            -f Dockerfile --target browser -t "$BROWSER_IMAGE" .
          namespace="$(sed -n 's/^MODULE4D_DEMO_TREND_NAMESPACE=//p' "$DEMO_ENV_FILE")"
          docker run --rm --network host --ipc=host \
            --label com.codex.task=module4d-d3-release \
            --label com.codex.resource=browser-e2e \
            -e MODULE4D_BROWSER_UI_URL=http://127.0.0.1:18501 \
            -e MODULE4D_BROWSER_API_URL=http://127.0.0.1:18000 \
            -e MODULE4D_DEMO_TREND_NAMESPACE="$namespace" \
            "$BROWSER_IMAGE"
      - name: Stop isolated demo and remove validation images
        if: ${{ always() && steps.demo.outcome == 'success' }}
        env:
          DEMO_RUN_ID: ${{ steps.demo.outputs.run_id }}
          DEMO_ENV_FILE: ${{ steps.demo.outputs.env_file }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          if [ -f "$DEMO_ENV_FILE" ]; then
            python3 -c 'import sys; from pathlib import Path; from scripts.dashboard.demo import stop_demo; stop_demo(sys.argv[1], Path(sys.argv[2]))' \
              "$DEMO_RUN_ID" "$DEMO_ENV_FILE" || status=$?
          fi
          for image in "$BROWSER_IMAGE" "$UI_TEST_IMAGE"; do
            if docker image inspect "$image" >/dev/null 2>&1; then
              docker image rm --force "$image" || status=$?
            fi
          done
          exit "$status"
