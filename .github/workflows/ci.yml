name: Fast validation
on:
  pull_request:
  push:
    branches: [main, module2-spark-batch-layer, module3-speed-layer, fix/module3-hardening]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build pinned Spark test runtime
        run: docker compose build spark-master
      - name: Lint
        run: >-
          docker run --rm -v "$PWD:/workspace" -w /workspace
          instacart-spark:3.5.5 ruff check .
      - name: Unit and fixture Spark tests
        run: >-
          docker run --rm -v "$PWD:/workspace" -w /workspace
          instacart-spark:3.5.5 python3 -m pytest -q
          --ignore=tests/test_module4d_api_mongo.py
          --ignore=tests/test_module4d_batch_api_mongo.py
          --ignore=tests/test_module4d_ui_app.py
          --ignore=tests/test_module4d_ui_client.py
          --ignore=tests/test_module4d_ui_evaluation.py
      - name: Run D1A/D1B API and isolated MongoDB tests
        run: python3 scripts/module4/module4d_api_validation.py --mode all

  module4d-demo-browser:
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Spark test runtime
        run: docker compose build spark-master
      - name: Run dashboard UI regression tests
        run: |
          docker build --label com.codex.task=module4d-d3-release \
            --build-arg MODULE4D_UI_DEV=1 \
            -f Dockerfile --target ui \
            -t instacart-module4d-ui-dev:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} .
          docker run --rm \
            --label com.codex.task=module4d-d3-release \
            --label com.codex.resource=ui-regression-tests \
            -v "$PWD:/workspace:ro" -w /workspace \
            -e PYTHONPATH=/workspace \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTEST_ADDOPTS="-p no:cacheprovider" \
            instacart-module4d-ui-dev:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} \
            python -m pytest -q \
            tests/test_module4d_ui_app.py \
            tests/test_module4d_ui_client.py \
            tests/test_module4d_ui_evaluation.py
      - name: Run isolated MongoDB publisher, API, and Chromium release checks
        shell: bash
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/module4d-demo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.env"
          project="module4d-d3-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          browser_image="instacart-module4d-demo-browser:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          compose=(docker compose --project-name "$project" --env-file "$env_file" -f deploy/module4/compose.demo.yaml)
          cleanup() {
            "${compose[@]}" down --remove-orphans >/dev/null 2>&1 || true
            rm -f "$env_file"
            docker image ls --filter label=com.codex.task=module4d-d3-release -q \
              | sort -u | xargs -r docker image rm --force >/dev/null 2>&1 || true
            docker image rm --force "$browser_image" \
              "instacart-module4d-ui-dev:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          python3 scripts/module4/module4d_demo_env.py --output "$env_file"
          chmod 600 "$env_file"
          "${compose[@]}" config --quiet
          "${compose[@]}" build module4d-api module4d-ui
          "${compose[@]}" up -d module4d-mongo
          "${compose[@]}" run --rm fixture
          "${compose[@]}" up -d module4d-api module4d-ui
          "${compose[@]}" run --rm validator

          docker build --label com.codex.task=module4d-d3-release \
            -f Dockerfile --target browser -t "$browser_image" .
          namespace="$(sed -n 's/^MODULE4D_DEMO_TREND_NAMESPACE=//p' "$env_file")"
          docker run --rm --network host --ipc=host \
            --label com.codex.task=module4d-d3-release \
            --label com.codex.resource=browser-e2e \
            -e MODULE4D_BROWSER_UI_URL=http://127.0.0.1:18501 \
            -e MODULE4D_BROWSER_API_URL=http://127.0.0.1:18000 \
            -e MODULE4D_DEMO_TREND_NAMESPACE="$namespace" \
            "$browser_image"
