name: Module 3 streaming validation
on:
  push:
    branches:
      - module3-speed-layer
    paths:
      - 'src/module3/**'
      - 'src/module1/producer.py'
      - 'src/module1/config.py'
      - 'scripts/module3.py'
      - 'tests/test_module3.py'
      - 'compose.yaml'
      - 'Dockerfile.spark'
      - 'requirements*.txt'
      - '.github/workflows/module3-full.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: module3-full-${{ github.ref }}
  cancel-in-progress: false
jobs:
  streaming:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Host dependencies and environment
        run: |
          python -m pip install -r requirements.txt
          mkdir -p results/ci
          { uname -a; free -h; df -h; docker version; docker compose version; } > results/ci/environment.txt
          docker compose config --quiet
      - name: Regenerate Module 1 feed (small subset for streaming)
        run: |
          python scripts/fetch_instacart.py
          python -m src.module1.clean --validate
          python -m src.module1.generate --scenario default --scatter-weeks 13 --batch-users 2000 --out-dir data/synthesized/scatter_3m
      - name: Build pinned Spark runtime and run streaming tests
        run: |
          docker compose build spark-master
          docker compose run --rm --no-deps --entrypoint python3 module3 -m pytest -q tests/test_module3.py
      - name: Start services (Spark, Kafka, Mongo)
        run: |
          docker compose up -d --wait spark-master spark-worker kafka mongodb
      - name: Validate connectivity (no streaming)
        run: python scripts/module3.py validate
      - name: Run throughput benchmark (requires producer running concurrently)
        run: |
          # Start a background producer at bulk replay speed
          docker compose run -d --no-deps --entrypoint python3 module3 -m src.module1.producer \
            --feed data/synthesized/scatter_3m --limit-events 200000 --replay-speed 0 &
          PRODUCER_PID=$!
          python scripts/module3.py benchmark-throughput --duration-seconds 30
          wait $PRODUCER_PID || true
      - name: Capture runtime diagnostics
        if: always()
        run: |
          mkdir -p results/ci
          docker compose ps -a > results/ci/compose-status.txt
          docker compose logs --no-color --tail 300 kafka spark-master spark-worker > results/ci/compose-logs.txt
          sudo chown -R "$(id -u):$(id -g)" results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module3-evidence
          retention-days: 14
          path: |
            results/ci/
            results/module3/*/summary.json
            results/module3/*/streaming_progress.jsonl
      - name: Stop ephemeral services
        if: always()
        run: docker compose down
