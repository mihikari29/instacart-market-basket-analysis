name: Module 2 full-data validation
on:
  push:
    branches: [module2-spark-batch-layer]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'compose.yaml'
      - 'Dockerfile.spark'
      - 'requirements*.txt'
      - '.github/workflows/module2-full.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: module2-full-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Host dependencies and environment
        run: |
          python -m pip install -r requirements.txt
          mkdir -p results/ci
          { uname -a; free -h; df -h; docker version; docker compose version; } > results/ci/environment.txt
          docker compose config --quiet
      - name: Fetch and validate full public source
        run: python scripts/fetch_instacart.py
      - name: Regenerate corrected Module 1 handoff
        run: |
          python src/clean.py --validate
          python src/generate.py --scenario default --scatter-weeks 13 --batch-users 2000 --out-dir data/synthesized/scatter_3m
      - name: Build pinned Spark runtime and run tests
        run: |
          docker compose build spark-master
          docker compose run --rm --no-deps --entrypoint python3 module2 -m pytest -q
      - name: Start HDFS and stage all data
        run: |
          docker compose up -d --wait namenode datanode
          docker compose exec -T namenode hdfs dfsadmin -safemode wait
          python src/stage_hdfs.py
      - name: Canonical full Module 2 execution
        run: python scripts/module2.py all --shuffle-partitions 32 --source-events data/synthesized/scatter_3m/events.parquet
      - name: Verify full counts and serving outputs
        run: docker compose run --rm --no-deps --entrypoint python3 module2 scripts/check_full_run.py
      - name: Capture runtime diagnostics
        if: always()
        run: |
          mkdir -p results/ci
          docker compose ps -a > results/ci/compose-status.txt
          docker compose logs --no-color --tail 300 > results/ci/compose-logs.txt
          sudo chown -R "$(id -u):$(id -g)" results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module2-full-evidence
          retention-days: 14
          path: |
            results/ci/
            results/module2/*/summary.json
            results/module2/*/analytics.json
            data/raw/source-receipt.json
            data/synthesized/scatter_3m/manifest.json
      - name: Stop ephemeral services
        if: always()
        run: docker compose down
