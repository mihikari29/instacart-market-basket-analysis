[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-ecommerce-bigdata-analytics"
version = "0.1.0"
description = "Real-time and batch analytics for historical e-commerce behavior data"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
  { name = "Real-Time E-commerce Big Data Analytics contributors" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
